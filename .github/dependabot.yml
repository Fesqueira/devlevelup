version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    target-branch: develop
    groups:
      minor-patch:
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']